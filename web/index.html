<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediaPipe Demo App</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>MediaPipe Demo App</h1>
        <nav class="mode-switcher" aria-label="Mode switcher">
          <button id="mode1Button" class="mode-button is-active" type="button">Mode 1</button>
          <button id="mode2Button" class="mode-button" type="button">Mode 2</button>
        </nav>
      </header>

      <p id="statusMessage" class="status-message" role="status">Starting camera...</p>

      <video id="cameraSource" class="camera-source" autoplay muted playsinline aria-hidden="true"></video>

      <section id="mode1Panes" class="mode1-panes" aria-label="Mode 1 abstraction comparison">
        <article class="pane">
          <h2>侵入者検知</h2>
          <p class="bandwidth-label">〜10kbps</p>
          <canvas id="silhouetteCanvas" width="1280" height="720"></canvas>
        </article>
        <article class="pane">
          <h2>プライバシー配慮</h2>
          <p class="bandwidth-label">〜100kbps</p>
          <canvas id="mosaicCanvas" width="1280" height="720"></canvas>
        </article>
        <article class="pane">
          <h2>顔認証映像</h2>
          <p class="bandwidth-label">数十〜100Mbps</p>
          <canvas id="faceOverlayCanvas" width="1280" height="720"></canvas>
        </article>
        <p class="bandwidth-note">※実際のビットレート計測ではなく、情報量の違いを説明する目安表示です</p>
      </section>

      <section id="mode2Panes" class="mode2-panes is-hidden" aria-label="Mode 2 semantic communication" aria-hidden="true">
        <article class="pane">
          <h2>LIVE VIDEO</h2>
          <canvas id="mode2LeftVideoCanvas" width="1280" height="720"></canvas>
        </article>
        <article class="pane semantic-pane">
          <h2>TRANSMITTED SEMANTICS</h2>
          <ul id="semanticInfoList" class="semantic-info-list"></ul>
        </article>
        <article class="pane reconstruction-pane">
          <h2>RECONSTRUCTION</h2>
          <div id="reconstructionContainer" class="reconstruction-placeholder">Coming soon</div>
        </article>
      </section>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
